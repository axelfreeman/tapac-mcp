name: publish

# Публикация в PyPI БЕЗ токена: доверенная публикация (OIDC).
# Токена не существует — украсть и ротировать нечего. Публикует GitHub Actions.
#
# Что нужно один раз на стороне PyPI (владелец):
#   pypi.org → project "tapac-mcp" → Publishing → Add a new pending publisher
#     Owner:       axelfreeman
#     Repository:  tapac-mcp
#     Workflow:    publish.yml
#     Environment: pypi
#
# После этого: поставить тег v* (или запустить workflow вручную) → пакет публикуется.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # это и есть доверенная публикация: короткоживущий OIDC-токен

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the artifacts
        run: |
          ls -la dist/
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
